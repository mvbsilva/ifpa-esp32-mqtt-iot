services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Configure DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../projeto-final/web:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mosquitto
    networks: [iot]
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883" # MQTT ESP32; restrinja no firewall à rede do laboratório
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./auth:/mosquitto/auth:ro
      - mosquitto_data:/mosquitto/data
    networks: [iot]
networks:
  iot:
volumes:
  caddy_data:
  caddy_config:
  mosquitto_data:
