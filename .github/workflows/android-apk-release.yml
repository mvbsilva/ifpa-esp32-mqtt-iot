name: Gerar APK Android e publicar Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub-hosted Ubuntu runners já incluem Android SDK.
      # Não usar android-actions/setup-android@v3: algumas versões tentam
      # instalar o pacote legado "tools", removido do repositório SDK.
      - name: Verificar Android SDK instalado
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-não definido}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-não definido}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "Android SDK não encontrado: $SDK"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK disponível em: $SDK"
          ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager || true
      - name: Instalar plataforma e build-tools Android
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -n "$SDKMANAGER" || { echo "sdkmanager não encontrado"; exit 1; }
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Instalar dependências
        working-directory: android-app
        run: npm install --no-audit --no-fund
      - name: Preparar Dashboard e MQTT.js offline
        working-directory: android-app
        run: npm run prepare:web
      - name: Gerar projeto Android
        working-directory: android-app
        run: npx cap add android
      - name: Habilitar conexões WS/HTTP na LAN
        working-directory: android-app
        run: node scripts/configure-android.mjs
      - name: Compilar APK de teste assinado com chave debug
        working-directory: android-app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Preparar APK
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk ESP32-Control-IFPA-debug.apk
      - name: Disponibilizar APK no Actions
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-Control-IFPA-Android
          path: ESP32-Control-IFPA-debug.apk
      - name: Publicar APK no GitHub Releases (somente tags)
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ESP32-Control-IFPA-debug.apk
          generate_release_notes: true
          body: |
            APK de laboratório assinado com chave DEBUG do GitHub Actions.
            Pode ser instalado manualmente; para distribuição duradoura,
            configure assinatura de release com keystore persistente.
